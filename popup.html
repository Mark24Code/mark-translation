<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Translation</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .language-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-selector select {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .translate-btn {
      background: #007acc;
      color: white;
    }

    .translate-btn:hover {
      background: #005a9e;
    }

    .clear-btn {
      background: #f5f5f5;
      color: #333;
    }

    .clear-btn:hover {
      background: #e0e0e0;
    }

    .settings-btn {
      background: transparent;
      color: #666;
      border: 1px solid #ddd;
    }

    .settings-btn:hover {
      background: #f5f5f5;
    }

    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Mark Translation</h1>
  </div>

  <div class="controls">
    <div class="language-selector">
      <select id="sourceLang">
        <option value="en">English →</option>
        <option value="zh">中文 →</option>
      </select>
      <select id="targetLang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="buttons">
      <button id="translateBtn" class="translate-btn">Translate Page</button>
      <button id="clearBtn" class="clear-btn">Clear</button>
    </div>

    <button id="settingsBtn" class="settings-btn">Settings</button>
  </div>

  <div id="status" class="status info">
    Ready to translate
  </div>

  <script type="module" src="./src/popup/index.tsx"></script>
</body>
</html>
